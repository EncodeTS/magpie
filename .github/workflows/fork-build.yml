name: Fork Build (macOS arm64 & Windows x64)

on:
  push:
    tags:
      - 'fork-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (must contain -fork, e.g. 0.1.4761-fork.1)'
        required: false
        type: string
      publish_release:
        description: 'Create/update GitHub Release on this fork'
        required: false
        default: true
        type: boolean
      macos_runner:
        description: 'macOS arm64 runner pool'
        required: false
        type: choice
        default: 'macos-15'
        options:
          - macos-15
          - macos-26
          - macos-latest

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - name: Resolve fork version and tag
        id: meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PUBLISH: ${{ github.event.inputs.publish_release }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/fork-* ]]; then
            TAG="$GITHUB_REF_NAME"
            if [[ "$TAG" =~ ^fork-v([0-9]+\.[0-9]+\.[0-9]+)-([0-9A-Za-z.-]+)$ ]]; then
              VERSION="${BASH_REMATCH[1]}-fork.${BASH_REMATCH[2]}"
            else
              raw="${TAG#fork-}"
              raw="${raw#v}"
              if [[ "$raw" == *-fork* ]]; then
                VERSION="$raw"
              else
                VERSION="${raw}-fork.1"
              fi
            fi
            PUBLISH="true"
          else
            if [[ -n "${INPUT_VERSION:-}" ]]; then
              VERSION="${INPUT_VERSION#v}"
            else
              short_sha="${GITHUB_SHA:0:7}"
              VERSION="0.1.4761-fork.${short_sha}"
            fi
            TAG="fork-v${VERSION}"
            PUBLISH="${INPUT_PUBLISH:-true}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]*fork[0-9A-Za-z.-]*$ ]]; then
            echo "::error::Invalid fork version '$VERSION': must be semver with -fork prerelease suffix" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION publish=$PUBLISH"

  darwin-arm64:
    needs: prepare
    runs-on: ${{ github.event.inputs.macos_runner || 'macos-15' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify Apple Silicon runner
        run: |
          [ "$(uname -m)" = "arm64" ]

      - name: Build magpie.app (darwin/arm64)
        run: make app VERSION="${{ needs.prepare.outputs.version }}"

      - name: Ad-hoc sign and verify bundle
        run: |
          codesign --force --sign - magpie.app
          codesign --verify --strict --verbose=2 magpie.app
          codesign -dv --verbose=2 magpie.app 2>&1 || true

      - name: Smoke check app version
        run: |
          out=$(./magpie.app/Contents/MacOS/magpie --version)
          echo "$out"
          echo "$out" | grep -F "magpie ${{ needs.prepare.outputs.version }}"

      - name: Package DMG and ZIP
        run: |
          set -euo pipefail
          DMG="magpie-darwin-arm64.dmg"
          mkdir -p "$RUNNER_TEMP/dmg"
          cp -R magpie.app "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          SIZE=$(( $(du -sm "$RUNNER_TEMP/dmg" | cut -f1) * 5 / 4 + 32 ))m
          for try in 1 2 3 4 5; do
            hdiutil create -volname magpie -srcfolder "$RUNNER_TEMP/dmg" -size "$SIZE" -ov -format UDZO "$DMG" && break
            [ "$try" = 5 ] && exit 1
            echo "hdiutil create failed (try $try), retrying"
            rm -f "$DMG"
            sleep $((try * 10))
          done
          ditto -c -k --keepParent magpie.app magpie-darwin-arm64.zip

      - name: Upload darwin-arm64 artifacts
        uses: actions/upload-artifact@v6
        with:
          name: magpie-darwin-arm64
          path: |
            magpie-darwin-arm64.dmg
            magpie-darwin-arm64.zip
          if-no-files-found: error

  windows-amd64:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build desktop executable (windows/amd64)
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          WINVER=$(echo "$VERSION" | sed -E 's/^v//; s/[^0-9.].*//')
          go run ./build/assetpack internal/gui/assets internal/gui/assets.zip
          go run ./build/conpty
          mkdir -p dist
          go run github.com/tc-hib/go-winres@v0.3.3 make --in build/windows/winres.json --arch amd64 --out rsrc \
            --file-version "${WINVER:-0.0.0}" --product-version "${WINVER:-0.0.0}"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags="-s -w" \
            -o internal/update/launcher-amd64.com ./internal/update/launcher
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build \
            -tags production,comlauncher,packedassets,conptypair -trimpath \
            -ldflags="-s -w -X main.version=${VERSION} -H windowsgui" \
            -o dist/magpie-windows-amd64.exe .
          rm -f rsrc_windows_*.syso internal/update/launcher-*.com

      - name: Upload windows-amd64 artifact
        uses: actions/upload-artifact@v6
        with:
          name: magpie-windows-amd64
          path: dist/magpie-windows-amd64.exe
          if-no-files-found: error

  windows-amd64-check:
    needs: [prepare, windows-amd64]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download windows-amd64 build
        uses: actions/download-artifact@v7
        with:
          name: magpie-windows-amd64
          path: dist

      - name: Smoke check Windows binary and gateway
        shell: pwsh
        run: |
          $env:MAGPIE_UPDATE_FEED = "http://127.0.0.1:9/"
          $exe = "dist\magpie-windows-amd64.exe"
          $v = (& $exe --version | Out-String).Trim()
          Write-Output $v
          if ($v -notlike "magpie ${{ needs.prepare.outputs.version }}*") {
            throw "unexpected version: $v"
          }
          $log = "$env:RUNNER_TEMP\magpie"
          $p = Start-Process -FilePath $exe -ArgumentList app -PassThru -RedirectStandardOutput "$log.out" -RedirectStandardError "$log.err"
          function Fail($why) {
            Get-Content "$log.out", "$log.err" -ErrorAction SilentlyContinue
            throw $why
          }
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { Fail "magpie exited with $($p.ExitCode)" }
            try {
              Invoke-WebRequest http://127.0.0.1:3425/v1/models -UseBasicParsing | Out-Null
              $ok = $true
              break
            } catch {}
          }
          if (-not $ok) { Fail "the gateway never answered" }
          Start-Sleep -Seconds 5
          if ($p.HasExited) { Fail "magpie exited with $($p.ExitCode)" }
          Stop-Process -Id $p.Id
          Write-Output "windows/amd64 magpie ran and served the gateway"

  publish:
    needs: [prepare, darwin-arm64, windows-amd64, windows-amd64-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout git history for release notes
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download macOS arm64 artifacts
        uses: actions/download-artifact@v7
        with:
          name: magpie-darwin-arm64
          path: release-assets

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v7
        with:
          name: magpie-windows-amd64
          path: release-assets

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum magpie-darwin-arm64.dmg magpie-darwin-arm64.zip magpie-windows-amd64.exe > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS
        env:
          FORK_UPDATE_SIGNING_KEY: ${{ secrets.FORK_UPDATE_SIGNING_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const raw = (process.env.FORK_UPDATE_SIGNING_KEY || "").trim();
            if (!raw) throw new Error("FORK_UPDATE_SIGNING_KEY secret is empty");
            const seed = Buffer.from(raw, "base64");
            if (seed.length !== 32) throw new Error("FORK_UPDATE_SIGNING_KEY must decode to 32 bytes");
            const pkcs8Prefix = Buffer.from("302e020100300506032b657004220420", "hex");
            const priv = crypto.createPrivateKey({ key: Buffer.concat([pkcs8Prefix, seed]), format: "der", type: "pkcs8" });
            const pub = crypto.createPublicKey(priv);
            const sums = fs.readFileSync("release-assets/SHA256SUMS", "utf8");
            const msg = Buffer.from(`magpie release ${process.env.VERSION}\n${sums}`, "utf8");
            const sig = crypto.sign(null, msg, priv);
            if (!crypto.verify(null, msg, pub, sig)) throw new Error("self-verify failed");
            fs.writeFileSync("release-assets/SHA256SUMS.sig", sig.toString("base64") + "\n", "utf8");
          '

      - name: Attest release artifacts
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            release-assets/magpie-darwin-arm64.dmg
            release-assets/magpie-darwin-arm64.zip
            release-assets/magpie-windows-amd64.exe

      - name: Upload consolidated workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: magpie-fork-packages
          path: release-assets/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const { execFileSync } = require("node:child_process");

            const tag = process.env.TAG || "";
            const version = process.env.VERSION || "";
            const sha = process.env.GITHUB_SHA || "HEAD";
            const zhMarker = "<!-- lang:zh -->";

            const git = (args) => {
              try {
                return execFileSync("git", args, { encoding: "utf8", stdio: ["ignore", "pipe", "ignore"] }).trim();
              } catch {
                return "";
              }
            };

            const installEn = [
              "## Install",
              "",
              `Personal fork build \`${version}\` (macOS arm64 & Windows x64 only).`,
              "",
              "- macOS app bundle is ad-hoc signed (`codesign --sign -`, not notarised). After moving `magpie.app` to `/Applications`, clear quarantine if Gatekeeper prompts:",
              "  `xattr -dr com.apple.quarantine /Applications/magpie.app`",
              "- Self-updates point to `EncodeTS/magpie` Releases (verified with the fork Ed25519 key and GitHub SLSA build attestations); official `usemagpie.ai` / `yetone/magpie-releases` overwrites remain blocked.",
            ].join("\n");

            const installZh = [
              "## 安装",
              "",
              `个人 Fork 构建 \`${version}\`（仅含 macOS arm64 与 Windows x64）。`,
              "",
              "- macOS 应用包使用本地自签名（`codesign --sign -`，未公证）；拖入 `/Applications` 后如 Gatekeeper 提示，可执行：",
              "  `xattr -dr com.apple.quarantine /Applications/magpie.app`",
              "- 自动更新指向 `EncodeTS/magpie` Releases（经由 Fork Ed25519 密钥与 GitHub SLSA 构建证明双重校验）；官方 `usemagpie.ai` / `yetone/magpie-releases` 覆盖仍会被拦截。",
            ].join("\n");

            let raw = "";
            if (tag && git(["for-each-ref", "--format=%(objecttype)", `refs/tags/${tag}`]) === "tag") {
              raw = git(["for-each-ref", "--format=%(contents)", `refs/tags/${tag}`]);
            }
            if (!raw) {
              const prev = git(["describe", "--tags", "--abbrev=0", "--match", "fork-v*", `${sha}^`]);
              let log = prev
                ? git(["log", "--first-parent", "--format=- %s (`%h`)", `${prev}..${sha}`])
                : git(["log", "-1", "--format=- %s (`%h`)", sha]);
              if (!log) log = git(["log", "-1", "--format=- %s (`%h`)", sha]);
              raw = prev ? `Changes since \`${prev}\`:\n\n${log}` : log;
            }

            let finalNotes = "";
            const markerMatch = raw.match(/^[ \t]*<!-- lang:zh -->[ \t]*$/m);
            if (markerMatch) {
              let enPart = raw.slice(0, markerMatch.index).trim();
              let zhPart = raw.slice(markerMatch.index + markerMatch[0].length).trim();
              if (!/^##\s+Install\b/im.test(enPart)) enPart = enPart ? `${enPart}\n\n${installEn}` : installEn;
              if (!/^##\s+安装\b/m.test(zhPart)) zhPart = zhPart ? `${zhPart}\n\n${installZh}` : installZh;
              finalNotes = `${enPart}\n\n${zhMarker}\n\n${zhPart}\n`;
            } else {
              let enPart = raw.trim();
              if (!/^##\s+Install\b/im.test(enPart)) enPart = enPart ? `${enPart}\n\n${installEn}` : installEn;
              finalNotes = `${enPart}\n`;
            }

            fs.writeFileSync("release-notes.md", finalNotes, "utf8");
          '
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --prerelease=false --latest --title "magpie ${VERSION}" --notes-file release-notes.md
            gh release upload "$TAG" release-assets/* -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release-assets/* -R "$GITHUB_REPOSITORY" \
              --latest --target "$GITHUB_SHA" --title "magpie ${VERSION}" --notes-file release-notes.md
          fi
